name: Publish public download

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        default: v0.0.9

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout installer
        uses: actions/checkout@v4

      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: pwsh
        run: |
          gh release download "$env:RELEASE_TAG" `
            --repo "${{ github.repository }}" `
            --pattern "PingNotify-win-x64*.zip" `
            --dir "$env:RUNNER_TEMP"
          $asset = Get-ChildItem "$env:RUNNER_TEMP\PingNotify-win-x64*.zip" | Select-Object -First 1
          if ($null -eq $asset) { throw "Release asset not found." }
          Copy-Item $asset.FullName "$env:RUNNER_TEMP\PingNotify-latest.zip"

      - name: Publish anonymous download
        env:
          SAS_URI: ${{ secrets.AZURE_CREDENTIALS_SAS_BLOB }}
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.tag }}
          TEMP: ${{ runner.temp }}
        run: |
          $sasUri = [Uri]$env:SAS_URI
          if ([string]::IsNullOrWhiteSpace($sasUri.Query) -or [string]::IsNullOrWhiteSpace($sasUri.AbsolutePath)) {
            throw 'AZURE_CREDENTIALS_SAS_BLOB must be a complete container SAS URI.'
          }
          $sasParts = $sasUri.AbsoluteUri -split '\?', 2
          $baseUri = $sasParts[0].TrimEnd('/')
          $sasQuery = $sasParts[1]

          function Publish-Blob([string]$name, [string]$file, [string]$contentType) {
            $blobUri = "$baseUri/$name`?$sasQuery"
            Invoke-WebRequest `
              -Uri $blobUri `
              -Method Put `
              -InFile $file `
              -Headers @{ 'x-ms-blob-type' = 'BlockBlob'; 'x-ms-version' = '2021-12-02' } `
              -ContentType $contentType `
              -UseBasicParsing | Out-Null
          }

          Publish-Blob 'PingNotify-latest.zip' "$env:TEMP\PingNotify-latest.zip" 'application/zip'

          $manifest = @{ version = $env:RELEASE_VERSION; asset = "PingNotify-latest.zip" } |
            ConvertTo-Json -Compress
          $manifestPath = "$env:TEMP\latest.json"
          Set-Content -Path $manifestPath -Value $manifest -Encoding utf8
          Publish-Blob 'latest.json' $manifestPath 'application/json'
          Publish-Blob 'install.ps1' "${{ github.workspace }}\install.ps1" 'text/plain'

          az storage blob upload `
            --account-name $account `
            --container-name $container `
            --name install.ps1 `
            --file "${{ github.workspace }}\install.ps1" `
            --overwrite `
            --content-type text/plain `
            --sas-token "$sasToken" `
            --output none
