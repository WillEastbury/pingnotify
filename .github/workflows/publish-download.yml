name: Publish public download

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        default: v0.0.9

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: pwsh
        run: |
          gh release download "$env:RELEASE_TAG" `
            --repo "${{ github.repository }}" `
            --pattern "PingNotify-win-x64*.zip" `
            --dir "$env:RUNNER_TEMP"
          $asset = Get-ChildItem "$env:RUNNER_TEMP\PingNotify-win-x64*.zip" | Select-Object -First 1
          if ($null -eq $asset) { throw "Release asset not found." }
          Copy-Item $asset.FullName "$env:RUNNER_TEMP\PingNotify-latest.zip"

      - name: Publish anonymous download
        env:
          STORAGE_ACCOUNT: notificationstatus
          SAS_TOKEN: ${{ secrets.AZURE_CREDENTIALS_SAS_BLOB }}
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.tag }}
          TEMP: ${{ runner.temp }}
        run: |
          az storage container create `
            --account-name $env:STORAGE_ACCOUNT `
            --name downloads `
            --public-access blob `
            --sas-token $env:SAS_TOKEN `
            --output none

          az storage container set-permission `
            --account-name $env:STORAGE_ACCOUNT `
            --name downloads `
            --public-access blob `
            --sas-token $env:SAS_TOKEN `
            --output none

          az storage blob upload `
            --account-name $env:STORAGE_ACCOUNT `
            --container-name downloads `
            --name PingNotify-latest.zip `
            --file "$env:TEMP\PingNotify-latest.zip" `
            --overwrite `
            --content-type application/zip `
            --sas-token $env:SAS_TOKEN `
            --output none

          $manifest = @{ version = $env:RELEASE_VERSION; asset = "PingNotify-latest.zip" } |
            ConvertTo-Json -Compress
          $manifestPath = "$env:TEMP\latest.json"
          Set-Content -Path $manifestPath -Value $manifest -Encoding utf8
          az storage blob upload `
            --account-name $env:STORAGE_ACCOUNT `
            --container-name downloads `
            --name latest.json `
            --file $manifestPath `
            --overwrite `
            --content-type application/json `
            --sas-token $env:SAS_TOKEN `
            --output none
